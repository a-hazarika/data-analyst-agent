services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analyst
    ports: ["5436:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data
      - ./db:/db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analyst"]
      interval: 5s
      retries: 10

  api:
    build: ./analyst-agent
    env_file: ./analyst-agent/.env
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/analyst
      READONLY_DATABASE_URL: postgresql+psycopg://analyst_ro:change-me@db:5432/analyst
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./analyst-agent
          target: /app
          ignore: [.venv/]
        - action: rebuild
          path: ./analyst-agent/uv.lock    
volumes:
  pgdata:

  